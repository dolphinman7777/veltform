  <line x1="296" y1="368" x2="296" y2="318"/>
  <line x1="390" y1="368" x2="390" y2="318"/>
  <line x1="484" y1="368" x2="484" y2="318"/>
  <path d="M108,368 L155,318"/><path d="M202,368 L249,318"/>
  <path d="M296,368 L343,318"/><path d="M390,368 L437,318"/>
  <path d="M484,368 L531,318"/>
  <line x1="108" y1="318" x2="578" y2="318"/>
  <line x1="155" y1="318" x2="155" y2="342"/>
  <line x1="249" y1="318" x2="249" y2="342"/>
  <line x1="343" y1="318" x2="343" y2="342"/>
  <line x1="437" y1="318" x2="437" y2="342"/>
  <line x1="531" y1="318" x2="531" y2="342"/>
</g>

<!-- right gable -->
<g stroke="#474948" stroke-width="0.95" fill="none">
  <line x1="578" y1="502" x2="732" y2="442"/>
  <line x1="578" y1="368" x2="732" y2="318"/>
  <line x1="578" y1="318" x2="732" y2="268"/>
  <line x1="732" y1="442" x2="732" y2="268"/>
  <path d="M578,318 L732,268 L732,218 L655,198"/>
  <rect x="648" y="360" width="52" height="78" fill="#F4F4F4" stroke="#474948" stroke-width="0.9"/>
