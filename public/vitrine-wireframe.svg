  <circle cx="688" cy="402" r="2.5" fill="#474948"/>
  <rect x="656" y="372" width="14" height="10" stroke="#474948" stroke-width="0.6"/>
</g>

<!-- roof grid -->
<g stroke="#474948" stroke-width="0.85" fill="none">
  <line x1="140" y1="300" x2="500" y2="275"/>
  <line x1="160" y1="290" x2="520" y2="265"/>
  <line x1="180" y1="280" x2="540" y2="255"/>
  <line x1="200" y1="270" x2="560" y2="245"/>
  <line x1="220" y1="260" x2="340" y2="248"/>
  <line x1="160" y1="290" x2="200" y2="270"/>
  <line x1="340" y1="270" x2="380" y2="258"/>
  <line x1="500" y1="275" x2="540" y2="255"/>
  <line x1="540" y1="255" x2="700" y2="228"/>
  <line x1="560" y1="245" x2="710" y2="218"/>
  <line x1="578" y1="268" x2="732" y2="228"/>
  <line x1="108" y1="248" x2="340" y2="198"/>
  <line x1="340" y1="198" x2="655" y2="198"/>
  <line x1="578" y1="318" x2="655" y2="198"/>
  <path d="M318,262 L358,248 L358,238 L318,252 Z" fill="#F4F4F4" stroke="#474948" stroke-width="1"/>
  <line x1="318" y1="252" x2="318" y2="262"/>
  <line x1="338" y1="243" x2="338" y2="255" stroke-dasharray="2 2"/>
</g>

<!-- cresting finials -->
<g stroke="#474948" stroke-width="0.75" fill="none">
  <path d="M96,248 Q104,226 112,248 Q120,220 128,248 Q136,226 144,248 Q152,226 160,248"/>
  <path d="M96,248 Q100,236 104,248 Q108,228 112,248"/>
  <line x1="96" y1="248" x2="160" y2="248"/>
  <path d="M648,198 Q656,176 664,198 Q672,170 680,198 Q688,176 696,198 Q704,176 712,198"/>
  <path d="M648,198 Q652,186 656,198 Q660,178 664,198"/>
  <line x1="648" y1="198" x2="712" y2="198"/>
</g>

<!-- primary outline -->
<g stroke="#474948" stroke-width="1.35" fill="none" stroke-linejoin="round">
  <path d="M108,502 L578,502 L732,442 L732,318 L578,368 L108,368 Z"/>
  <path d="M108,368 L108,318 L108,248 L340,198 L655,198 L732,268 L578,318"/>
  <line x1="108" y1="318" x2="578" y2="318"/>
  <line x1="578" y1="502" x2="578" y2="318"/>
  <line x1="108" y1="502" x2="108" y2="368"/>
</g>

<!-- telemetry leads -->
<g stroke="#474948" stroke-width="1" stroke-dasharray="5 4" opacity="0.68" fill="none">
  <line x1="338" y1="245" x2="338" y2="55"/>
  <line x1="128" y1="238" x2="24" y2="48"/>
  <line x1="680" y1="198" x2="920" y2="42"/>
  <line x1="249" y1="340" x2="24" y2="310"/>
  <line x1="437" y1="340" x2="920" y2="300"/>
  <line x1="688" y1="395" x2="920" y2="430"/>
  <line x1="343" y1="455" x2="343" y2="590"/>
  <line x1="155" y1="502" x2="24" y2="560"/>
</g>

<style>
  .pulse { animation: sp 2.2s ease-in-out infinite; }
  .pulse.d2 { animation-delay: 0.7s; }
  @keyframes sp { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
</style>
<g>
  <circle class="pulse"    cx="338" cy="245" r="5" fill="#D4FFD3" stroke="#474948" stroke-width="1.1"/>
  <circle class="pulse"    cx="128" cy="238" r="5" fill="#D4FFD3" stroke="#474948" stroke-width="1.1"/>
  <circle class="pulse"    cx="680" cy="198" r="5" fill="#D4FFD3" stroke="#474948" stroke-width="1.1"/>
  <circle class="pulse d2" cx="249" cy="340" r="4.5" fill="#889B89" stroke="#474948" stroke-width="1"/>
  <circle class="pulse d2" cx="437" cy="340" r="4.5" fill="#889B89" stroke="#474948" stroke-width="1"/>
  <circle class="pulse d2" cx="688" cy="395" r="4.5" fill="#889B89" stroke="#474948" stroke-width="1"/>
  <circle class="pulse d2" cx="343" cy="455" r="4.5" fill="#889B89" stroke="#474948" stroke-width="1"/>
  <circle class="pulse d2" cx="155" cy="502" r="4.5" fill="#889B89" stroke="#474948" stroke-width="1"/>
</g>

<!-- scale bar -->
<g stroke="#474948" stroke-width="0.7" opacity="0.45">
  <line x1="780" y1="560" x2="880" y2="560"/>
  <line x1="780" y1="556" x2="780" y2="564"/>
  <line x1="880" y1="556" x2="880" y2="564"/>
  <text x="830" y="575" text-anchor="middle" font-family="monospace" font-size="9" fill="#889B89">4.2 m</text>
</g>
</svg>
