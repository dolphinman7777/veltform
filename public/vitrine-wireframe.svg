<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" fill="none">
<title>Vitrine MK.I wireframe conservatory</title>
<defs>
  <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#474948" stop-opacity="0"/>
    <stop offset="100%" stop-color="#474948" stop-opacity="0.14"/>
  </linearGradient>
  <pattern id="triGrid" width="14" height="12" patternUnits="userSpaceOnUse">
    <path d="M0,12 L7,0 L14,12 Z" fill="none" stroke="#474948" stroke-opacity="0.14" stroke-width="0.5"/>
  </pattern>
</defs>

<!-- ground -->
<ellipse cx="430" cy="538" rx="340" ry="28" fill="url(#groundFade)"/>
<path d="M108,502 L738,442 L738,448 L108,508 Z" fill="#474948" opacity="0.06"/>

<!-- face fills -->
<g fill="#F4F4F4" stroke="none">
  <path d="M108,502 L578,502 L578,368 L108,368 Z"/>
  <path d="M578,502 L732,442 L732,318 L578,368 Z"/>
  <path d="M108,368 L578,368 L578,318 L108,318 Z"/>
  <path d="M578,368 L732,318 L732,268 L578,318 Z"/>
  <path d="M108,318 L578,318 L340,198 L108,248 Z"/>
  <path d="M578,318 L732,268 L732,218 L655,198 L578,268 Z"/>
  <path d="M108,248 L340,198 L655,198 L578,268 L108,318 Z" opacity="0.94"/>
</g>

<!-- knee wall panels -->
<g fill="url(#triGrid)" stroke="#474948" stroke-width="0.9" opacity="0.85">
  <rect x="108" y="368" width="94" height="134"/>
  <rect x="202" y="368" width="94" height="134"/>
  <rect x="296" y="368" width="94" height="134"/>
  <rect x="390" y="368" width="94" height="134"/>
  <rect x="484" y="368" width="94" height="134"/>
  <path d="M578,368 L732,318 L732,442 L578,502 Z"/>
</g>
<g stroke="#474948" stroke-width="0.8" fill="none" opacity="0.55">
  <rect x="122" y="400" width="66" height="90" rx="1"/><ellipse cx="155" cy="445" rx="18" ry="26"/>
  <rect x="216" y="400" width="66" height="90" rx="1"/><ellipse cx="249" cy="445" rx="18" ry="26"/>
  <rect x="310" y="400" width="66" height="90" rx="1"/><ellipse cx="343" cy="445" rx="18" ry="26"/>
  <rect x="404" y="400" width="66" height="90" rx="1"/><ellipse cx="437" cy="445" rx="18" ry="26"/>
  <rect x="498" y="400" width="66" height="90" rx="1"/><ellipse cx="531" cy="445" rx="18" ry="26"/>
</g>

