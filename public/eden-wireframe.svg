<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" fill="none">
<title>Eden MK.I wireframe conservatory</title>
<defs>
  <pattern id="fieldGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20,0 L0,0 0,20" fill="none" stroke="#474948" stroke-opacity="0.08" stroke-width="0.5"/>
  </pattern>
  <style>
    .wire { fill: none; stroke: #474948; stroke-width: 1.1; }
    .wire-light { fill: none; stroke: #474948; stroke-width: 0.8; opacity: 0.5; }
    .fill-panel { fill: #fff; stroke: none; }
    .accent { fill: #9ec9e8; stroke: #474948; stroke-width: 0.9; }
  </style>
</defs>

<rect width="960" height="620" fill="#f4f4f4"/>
<rect width="960" height="620" fill="url(#fieldGrid)"/>

<!-- face fills -->
<g class="fill-panel">
  <path d="M108,502 L578,502 L578,368 L108,368 Z"/>
  <path d="M578,502 L732,442 L732,318 L578,368 Z"/>
  <path d="M108,368 L578,368 L578,318 L108,318 Z"/>
  <path d="M578,368 L732,318 L732,268 L578,318 Z"/>
  <path d="M108,318 L578,318 L340,198 L108,248 Z"/>
  <path d="M578,318 L732,268 L732,218 L655,198 L578,268 Z"/>
  <path d="M108,248 L340,198 L655,198 L578,268 L108,318 Z" opacity="0.96"/>
</g>

<!-- knee wall panels -->
<g class="wire" opacity="0.75">
  <rect x="108" y="368" width="94" height="134"/>
  <rect x="202" y="368" width="94" height="134"/>
  <rect x="296" y="368" width="94" height="134"/>
  <rect x="390" y="368" width="94" height="134"/>
  <rect x="484" y="368" width="94" height="134"/>
  <path d="M578,368 L732,318 L732,442 L578,502 Z"/>
</g>
<g class="wire-light">
  <rect x="122" y="400" width="66" height="90" rx="1"/><ellipse cx="155" cy="445" rx="18" ry="26"/>
  <rect x="216" y="400" width="66" height="90" rx="1"/><ellipse cx="249" cy="445" rx="18" ry="26"/>
  <rect x="310" y="400" width="66" height="90" rx="1"/><ellipse cx="343" cy="445" rx="18" ry="26"/>
  <rect x="404" y="400" width="66" height="90" rx="1"/><ellipse cx="437" cy="445" rx="18" ry="26"/>
  <rect x="498" y="400" width="66" height="90" rx="1"/><ellipse cx="531" cy="445" rx="18" ry="26"/>
</g>

<!-- front glazing -->
<g class="wire">
  <line x1="202" y1="368" x2="202" y2="318"/>
  <line x1="296" y1="368" x2="296" y2="318"/>
  <line x1="390" y1="368" x2="390" y2="318"/>
  <line x1="484" y1="368" x2="484" y2="318"/>
  <path d="M108,368 L155,318"/><path d="M202,368 L249,318"/>
  <path d="M296,368 L343,318"/><path d="M390,368 L437,318"/>
  <path d="M484,368 L531,318"/>
  <line x1="108" y1="318" x2="578" y2="318"/>
  <line x1="155" y1="318" x2="155" y2="342"/>
  <line x1="249" y1="318" x2="249" y2="342"/>
  <line x1="343" y1="318" x2="343" y2="342"/>
  <line x1="437" y1="318" x2="437" y2="342"/>
  <line x1="531" y1="318" x2="531" y2="342"/>
</g>

<!-- right gable -->
<g class="wire">
  <line x1="578" y1="502" x2="732" y2="442"/>
  <line x1="578" y1="368" x2="732" y2="318"/>
  <line x1="578" y1="318" x2="732" y2="268"/>
  <line x1="732" y1="442" x2="732" y2="268"/>
  <path d="M578,318 L732,268 L732,218 L655,198"/>
  <rect x="648" y="360" width="52" height="78" fill="#fff"/>
  <line x1="674" y1="360" x2="674" y2="438"/>
  <circle cx="688" cy="402" r="2.5" fill="#474948"/>
  <rect x="656" y="372" width="14" height="10" class="wire-light"/>
</g>

<!-- roof grid -->
<g class="wire" opacity="0.9">
  <line x1="140" y1="300" x2="500" y2="275"/>
  <line x1="160" y1="290" x2="520" y2="265"/>
  <line x1="180" y1="280" x2="540" y2="255"/>
  <line x1="200" y1="270" x2="560" y2="245"/>
  <line x1="220" y1="260" x2="340" y2="248"/>
  <line x1="160" y1="290" x2="200" y2="270"/>
  <line x1="340" y1="270" x2="380" y2="258"/>
  <line x1="500" y1="275" x2="540" y2="255"/>
  <line x1="540" y1="255" x2="700" y2="228"/>
  <line x1="560" y1="245" x2="710" y2="218"/>
  <line x1="578" y1="268" x2="732" y2="228"/>
  <line x1="108" y1="248" x2="340" y2="198"/>
  <line x1="340" y1="198" x2="655" y2="198"/>
  <line x1="578" y1="318" x2="655" y2="198"/>
  <path d="M318,262 L358,248 L358,238 L318,252 Z" fill="#fff"/>
  <line x1="318" y1="252" x2="318" y2="262"/>
  <line x1="338" y1="243" x2="338" y2="255" stroke-dasharray="2 2" class="wire-light"/>
</g>

<!-- cresting -->
<g class="wire-light">
  <path d="M96,248 Q104,226 112,248 Q120,220 128,248 Q136,226 144,248 Q152,226 160,248"/>
  <line x1="96" y1="248" x2="160" y2="248"/>
  <path d="M648,198 Q656,176 664,198 Q672,170 680,198 Q688,176 696,198 Q704,176 712,198"/>
  <line x1="648" y1="198" x2="712" y2="198"/>
</g>

<!-- primary outline -->
<g class="wire" stroke-width="1.25" stroke-linejoin="round">
  <path d="M108,502 L578,502 L732,442 L732,318 L578,368 L108,368 Z"/>
  <path d="M108,368 L108,318 L108,248 L340,198 L655,198 L732,268 L578,318"/>
  <line x1="108" y1="318" x2="578" y2="318"/>
  <line x1="578" y1="502" x2="578" y2="318"/>
  <line x1="108" y1="502" x2="108" y2="368"/>
</g>

<!-- sensor nodes -->
<g>
  <circle class="accent" cx="338" cy="245" r="4.5"/>
  <circle class="accent" cx="128" cy="238" r="4.5"/>
  <circle class="accent" cx="680" cy="198" r="4.5"/>
  <circle class="accent" cx="249" cy="340" r="4"/>
  <circle class="accent" cx="437" cy="340" r="4"/>
  <circle class="accent" cx="688" cy="395" r="4"/>
  <circle class="accent" cx="343" cy="455" r="4"/>
  <circle class="accent" cx="155" cy="502" r="4"/>
</g>

<!-- scale bar -->
<g class="wire-light" stroke-width="0.7">
  <line x1="780" y1="560" x2="880" y2="560"/>
  <line x1="780" y1="556" x2="780" y2="564"/>
  <line x1="880" y1="556" x2="880" y2="564"/>
  <text x="830" y="575" text-anchor="middle" font-family="monospace" font-size="9" fill="#889B89">4.2 m</text>
</g>
</svg>
